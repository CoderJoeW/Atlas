items:
  atlas:conveyor_belt:
    material: paper
    data:
      item-name: "<!i><gradient:#808080:#C0C0C0>Conveyor Belt"
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a belt in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
        - when:
            - gui
          model:
            type: minecraft:model
            path: minecraft:item/custom/conveyor_belt
            generation:
              parent: minecraft:item/generated
              textures:
                layer0: minecraft:item/custom/conveyor_belt
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/conveyor_belt
        generation:
          parent: minecraft:block/custom/conveyor_belt_base
          textures:
            north: minecraft:block/custom/conveyor_belt_front
            south: minecraft:block/custom/conveyor_belt_back
            east: minecraft:block/custom/conveyor_belt_side
            west: minecraft:block/custom/conveyor_belt_side
            up: minecraft:block/custom/conveyor_belt_top
            down: minecraft:block/custom/conveyor_belt_bottom
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 2.0
          resistance: 2.0
          is-suffocating: false
          is-redstone-conductor: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            facing:
              type: horizontal_direction
              default: north
            running:
              type: boolean
              default: false
          # Rendered as display entities rather than vanilla block states: all four directions
          # share one forced state and one model, spun with `yaw`. That costs nothing from the
          # auto-state pool, and it means a single north-facing top texture serves every rotation
          # instead of four pre-rotated copies.
          appearances:
            north:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt
            south:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt
                yaw: 180
            east:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt
                yaw: 90
            west:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt
                yaw: -90
            north_running:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt_running
            south_running:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt_running
                yaw: 180
            east_running:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt_running
                yaw: 90
            west_running:
              state: barrier
              entity_renderer:
                item: atlas:conveyor_belt_running
                yaw: -90
          variants:
            facing=north,running=false:
              appearance: north
            facing=south,running=false:
              appearance: south
            facing=east,running=false:
              appearance: east
            facing=west,running=false:
              appearance: west
            facing=north,running=true:
              appearance: north_running
            facing=south,running=true:
              appearance: south_running
            facing=east,running=true:
              appearance: east_running
            facing=west,running=true:
              appearance: west_running

items#1:
  # Render target only - the lit belt is never held or given, so it needs no icon and no recipe.
  atlas:conveyor_belt_running:
    material: paper
    data:
      item-name: "<!i><gradient:#808080:#C0C0C0>Conveyor Belt"
    model:
      type: minecraft:model
      path: minecraft:block/custom/conveyor_belt_running
      generation:
        parent: minecraft:block/custom/conveyor_belt_base
        textures:
          north: minecraft:block/custom/conveyor_belt_front_running
          south: minecraft:block/custom/conveyor_belt_back_running
          east: minecraft:block/custom/conveyor_belt_side_running
          west: minecraft:block/custom/conveyor_belt_side_running
          up: minecraft:block/custom/conveyor_belt_top_running
          down: minecraft:block/custom/conveyor_belt_bottom
    behavior:
      type: block_item
      block:
        loot:
          pools:
            - rolls: 1
              entries:
                - type: item
                  item: atlas:conveyor_belt
        settings:
          hardness: 2.0
          resistance: 2.0
          is-suffocating: false
          is-redstone-conductor: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        state:
          state: barrier
          entity_renderer:
            item: atlas:conveyor_belt_running

recipes:
  atlas:conveyor_belt:
    type: shapeless
    category: misc
    unlock-on-ingredient-obtained: true
    ingredients:
      - minecraft:iron_ingot
      - minecraft:iron_ingot
      - minecraft:iron_ingot
      - minecraft:redstone
      - minecraft:redstone
      - minecraft:redstone
    result:
      id: atlas:conveyor_belt
      count: 4

items:
  atlas:fluid_container:
    material: paper
    data:
      item-name: "<!i><gradient:#1E90FF:#00CED1>Fluid Container"
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a tank in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
        - when:
            - gui
          model:
            type: minecraft:model
            path: minecraft:item/custom/fluid_container
            generation:
              parent: minecraft:item/generated
              textures:
                layer0: minecraft:item/custom/fluid_container
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/fluid_container
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: false
          is-view-blocking: false
          is-redstone-conductor: false
          can-occlude: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            fluid:
              type: string
              values: [none, water, lava]
              default: none
            fill_level:
              type: int
              range: 0~5
              default: 0
          appearances:
            empty:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_empty
            water_1:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_water_1
            water_2:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_water_2
            water_3:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_water_3
            water_4:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_water_4
            water_5:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_water_5
            lava_1:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_lava_1
            lava_2:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_lava_2
            lava_3:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_lava_3
            lava_4:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_lava_4
            lava_5:
              state: barrier
              entity_renderer:
                item: atlas:fluid_container_lava_5
          variants:
            fluid=none,fill_level=0:
              appearance: empty
            fluid=none,fill_level=1:
              appearance: empty
            fluid=none,fill_level=2:
              appearance: empty
            fluid=none,fill_level=3:
              appearance: empty
            fluid=none,fill_level=4:
              appearance: empty
            fluid=none,fill_level=5:
              appearance: empty
            fluid=water,fill_level=0:
              appearance: empty
            fluid=water,fill_level=1:
              appearance: water_1
            fluid=water,fill_level=2:
              appearance: water_2
            fluid=water,fill_level=3:
              appearance: water_3
            fluid=water,fill_level=4:
              appearance: water_4
            fluid=water,fill_level=5:
              appearance: water_5
            fluid=lava,fill_level=0:
              appearance: empty
            fluid=lava,fill_level=1:
              appearance: lava_1
            fluid=lava,fill_level=2:
              appearance: lava_2
            fluid=lava,fill_level=3:
              appearance: lava_3
            fluid=lava,fill_level=4:
              appearance: lava_4
            fluid=lava,fill_level=5:
              appearance: lava_5


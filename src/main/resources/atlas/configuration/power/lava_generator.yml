items:
  atlas:lava_generator:
    material: paper
    data:
      item-name: "<!i><gradient:#FF4500:#FFD700>Lava Generator"
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a generator in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
        - when:
            - gui
          model:
            type: minecraft:model
            path: minecraft:item/custom/lava_generator
            generation:
              parent: minecraft:item/generated
              textures:
                layer0: minecraft:item/custom/lava_generator
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/lava_generator
        generation:
          parent: minecraft:block/cube_bottom_top
          textures:
            top: minecraft:block/custom/lava_generator_top
            bottom: minecraft:block/custom/lava_generator_bottom
            side: minecraft:block/custom/lava_generator_side
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: true
          is-redstone-conductor: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        state:
          # Rendered as a display entity rather than a vanilla block state, so it costs no
          # slot from the scarce non-occluding auto-state pool.
          state: barrier
          entity_renderer:
            item: atlas:lava_generator


items:
  atlas:small_solar_panel:
    material: paper
    data:
      item-name: "<!i><gradient:#1E90FF:#FFD700>Small Solar Panel"
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a panel in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
        - when:
            - gui
          model:
            type: minecraft:model
            path: minecraft:item/custom/small_solar_panel
            generation:
              parent: minecraft:item/generated
              textures:
                layer0: minecraft:item/custom/small_solar_panel
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/small_solar_panel
        generation:
          parent: minecraft:block/custom/small_solar_panel_base
          textures:
            top: minecraft:block/custom/small_solar_panel
            bottom: minecraft:block/custom/small_solar_panel_bottom
            side: minecraft:block/custom/small_solar_panel_side
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: false
          is-redstone-conductor: false
          # The model is not a full cube, so it must not occlude - otherwise neighbouring
          # blocks cull their faces against it and you can see straight through the world.
          can-occlude: false
          is-view-blocking: false
          propagate-skylight: true
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        state:
          # Rendered as a display entity rather than a vanilla block state. That costs no
          # slot from the scarce non-occluding auto-state pool - every entity-rendered
          # appearance shares this one forced state.
          state: barrier
          entity_renderer:
            item: atlas:small_solar_panel


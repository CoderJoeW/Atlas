items:
  atlas:power_cable:
    material: paper
    data:
      item-name: <!i><gradient:#FFD700:#FF4500>Power Cable
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a cable in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
      - when:
        - gui
        model:
          type: minecraft:model
          path: minecraft:item/custom/power_cable
          generation:
            parent: minecraft:item/generated
            textures:
              layer0: minecraft:item/custom/power_cable
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/power_cable
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 2.0
          resistance: 2.0
          is-suffocating: false
          is-redstone-conductor: false
          push-reaction: push_only
          tags:
          - minecraft:mineable/pickaxe
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
          can-occlude: false
          is-view-blocking: false
          propagate-skylight: true
        states:
          properties:
            north:
              type: boolean
              default: false
            south:
              type: boolean
              default: false
            east:
              type: boolean
              default: false
            west:
              type: boolean
              default: false
            up:
              type: boolean
              default: false
            down:
              type: boolean
              default: false
            powered:
              type: boolean
              default: false

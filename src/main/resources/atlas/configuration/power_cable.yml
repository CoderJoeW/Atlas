items:
  atlas:power_cable:
    material: paper
    data:
      item-name: <!i><gradient:#FFD700:#FF4500>Power Cable
    model: minecraft:block/custom/power_cable
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 2.0
          resistance: 2.0
          is-suffocating: false
          is-redstone-conductor: false
          push-reaction: push_only
          tags:
          - minecraft:mineable/pickaxe
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
          can-occlude: false
          is-view-blocking: false
          propagate-skylight: true
        states:
          properties:
            facing:
              type: direction
              default: north
            powered:
              type: boolean
              default: false
          appearances:
            north:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable
                generation:
                  parent: minecraft:block/custom/power_cable_base
                  textures:
                    casing: minecraft:block/custom/power_cable_casing
                    end: minecraft:block/custom/power_cable_end
            south:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable
                y: 180
            east:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable
                y: 90
            west:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable
                y: 270
            up:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable
                x: 270
            down:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable
                x: 90
            north_powered:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable_powered
                generation:
                  parent: minecraft:block/custom/power_cable_base
                  textures:
                    casing: minecraft:block/custom/power_cable_casing_powered
                    end: minecraft:block/custom/power_cable_end_powered
            south_powered:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable_powered
                y: 180
            east_powered:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable_powered
                y: 90
            west_powered:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable_powered
                y: 270
            up_powered:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable_powered
                x: 270
            down_powered:
              auto-state: solid
              model:
                path: minecraft:block/custom/power_cable_powered
                x: 90
          variants:
            facing=north,powered=false:
              appearance: north
            facing=north,powered=true:
              appearance: north_powered
            facing=south,powered=false:
              appearance: south
            facing=south,powered=true:
              appearance: south_powered
            facing=east,powered=false:
              appearance: east
            facing=east,powered=true:
              appearance: east_powered
            facing=west,powered=false:
              appearance: west
            facing=west,powered=true:
              appearance: west_powered
            facing=up,powered=false:
              appearance: up
            facing=up,powered=true:
              appearance: up_powered
            facing=down,powered=false:
              appearance: down
            facing=down,powered=true:
              appearance: down_powered
recipes:
  atlas:power_cable:
    type: shapeless
    category: misc
    unlock-on-ingredient-obtained: true
    ingredients:
    - minecraft:copper_ingot
    result:
      id: atlas:power_cable
      count: 1

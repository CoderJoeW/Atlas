items:
  atlas:diamond_mine:
    material: paper
    data:
      item-name: "<!i><gradient:#146B7A:#4DE8FF>Diamond Mine"
    # The hardware is shared across all seven mines - the design chart draws every rig in the same
    # charcoal, and only the digging state carries the per-ore glow. What tells one mine from
    # another is the ore block in its jaws, rendered by the entity_renderer below.
    model:
      type: minecraft:model
      path: minecraft:block/custom/diamond_mine
      generation:
        parent: minecraft:block/custom/mine_gantry
        textures:
          deck: minecraft:block/custom/mine_deck
          side: minecraft:block/custom/mine_side
          bottom: minecraft:block/custom/mine_bottom
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: false
          is-view-blocking: false
          is-redstone-conductor: false
          # An open gantry over an excavation is nowhere near a full cube, so it must not occlude -
          # otherwise its neighbours cull their faces against it and the world shows through.
          can-occlude: false
          propagate-skylight: true
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            facing:
              type: horizontal_direction
              default: north
            # How far through a bore the mine is: 1 is idle, 2-5 are the four digging
            # steps. An int rather than the factories' `powered` boolean because a haul
            # takes 200-1000 ticks and has to read as progress rather than as a light
            # switch. It cannot be done with the vanilla break-progress overlay: a crack
            # is drawn by re-tessellating the client's model for the block at that
            # position, and every appearance below forces `state: barrier`, which has no
            # model to crumble.
            stage:
              type: int
              range: 1~5
              default: 1
          # Rendered as display entities rather than vanilla block states: every appearance
          # shares one forced barrier state, so none of them claims a slot from the
          # auto-state pools.
          #
          # Each is the shared charcoal hardware plus the ore being cut, as a real block in
          # the pit - that second element is what says both "I am mining" and "I am mining
          # THIS", the hardware being identical across all seven. Across the digging steps
          # the ore is eaten from half a cell down to an eighth, staying centred on the pit
          # floor, then snaps back to whole when the haul drops.
          appearances:
            idle_south:
              state: barrier
              entity_renderer:
                - item: atlas:diamond_mine
                - block: minecraft:diamond_ore
                  position: [0.25, 0.375, 0.25]
                  scale: [0.5, 0.5, 0.5]
            idle_north:
              state: barrier
              entity_renderer:
                - item: atlas:diamond_mine
                  yaw: 180
                - block: minecraft:diamond_ore
                  position: [0.25, 0.375, 0.25]
                  scale: [0.5, 0.5, 0.5]
            idle_east:
              state: barrier
              entity_renderer:
                - item: atlas:diamond_mine
                  yaw: -90
                - block: minecraft:diamond_ore
                  position: [0.25, 0.375, 0.25]
                  scale: [0.5, 0.5, 0.5]
            idle_west:
              state: barrier
              entity_renderer:
                - item: atlas:diamond_mine
                  yaw: 90
                - block: minecraft:diamond_ore
                  position: [0.25, 0.375, 0.25]
                  scale: [0.5, 0.5, 0.5]
            digging1_south:
              state: barrier
              entity_renderer:
                - item: atlas:diamond_mine_digging
                - block: minecraft:diamond_ore
                  position: [0.25, 0.375, 0.25]
                  scale: [0.5, 0.5, 0.5]
                  brightness:
                    block_light: 15
                    sky_light: 15
            digging1_north:

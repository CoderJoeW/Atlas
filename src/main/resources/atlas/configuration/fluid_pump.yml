items:
  atlas:fluid_pump:
    material: paper
    data:
      item-name: "<!i><gradient:#1E90FF:#00CED1>Fluid Pump"
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a pump in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
        - when:
            - gui
          model:
            type: minecraft:model
            path: minecraft:item/custom/fluid_pump
            generation:
              parent: minecraft:item/generated
              textures:
                layer0: minecraft:item/custom/fluid_pump
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/fluid_pump
        generation:
          parent: minecraft:block/cube
          textures:
            north: minecraft:block/custom/fluid_pump_casing_idle
            south: minecraft:block/custom/fluid_pump_casing_idle
            east: minecraft:block/custom/fluid_pump_casing_idle
            west: minecraft:block/custom/fluid_pump_casing_idle
            up: minecraft:block/custom/fluid_pump_casing_idle
            down: minecraft:block/custom/fluid_pump_casing_idle
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: true
          is-redstone-conductor: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            north:
              type: boolean
              default: false
            south:
              type: boolean
              default: false
            east:
              type: boolean
              default: false
            west:
              type: boolean
              default: false
            up:
              type: boolean
              default: false
            down:
              type: boolean
              default: false
            status:
              type: string
              values: [no_source, no_power, idle, extracting]
              default: no_source
          appearances:
            c000000_no_source:
              auto-state: solid
              model:
                path: minecraft:block/custom/fluid_pump_000000_no_source
                generation:
                  parent: minecraft:block/cube
                  textures:
                    north: minecraft:block/custom/fluid_pump_casing_no_source
                    south: minecraft:block/custom/fluid_pump_casing_no_source
                    east: minecraft:block/custom/fluid_pump_casing_no_source
                    west: minecraft:block/custom/fluid_pump_casing_no_source
                    up: minecraft:block/custom/fluid_pump_casing_no_source
                    down: minecraft:block/custom/fluid_pump_casing_no_source
            c000000_no_power:

items:
  atlas:fluid_pipe:
    material: paper
    data:
      item-name: "<!i><gradient:#1E90FF:#00CED1>Fluid Pipe"
    # The inventory shows a painted icon so the item is recognisable at a glance; every other
    # display context keeps the 3D block model so it still looks like a pipe in hand.
    model:
      type: minecraft:select
      property: minecraft:display_context
      cases:
        - when:
            - gui
          model:
            type: minecraft:model
            path: minecraft:item/custom/fluid_pipe
            generation:
              parent: minecraft:item/generated
              textures:
                layer0: minecraft:item/custom/fluid_pipe
      fallback:
        type: minecraft:model
        path: minecraft:block/custom/fluid_pipe
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 2.0
          resistance: 2.0
          is-suffocating: false
          is-redstone-conductor: false
          # The model is not a full cube, so it must not occlude - otherwise neighbouring blocks
          # cull their faces against it and you can see straight through the world.
          can-occlude: false
          is-view-blocking: false
          propagate-skylight: true
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            north:
              type: boolean
              default: false
            south:
              type: boolean
              default: false
            east:
              type: boolean
              default: false
            west:
              type: boolean
              default: false
            up:
              type: boolean
              default: false
            down:
              type: boolean
              default: false
            fluid:
              type: string
              values: [none, water, lava]
              default: none
          appearances:
            c000000:
              auto-state: cave_vines
              model:
                path: minecraft:block/custom/fluid_pipe_000000
                generation:
                  parent: minecraft:block/custom/fluid_pipe_shape_000000
                  textures:
                    glass: minecraft:block/custom/fluid_pipe_glass
                    core: minecraft:block/custom/fluid_pipe_core_none
            c000000_water:
              auto-state: cave_vines
              model:
                path: minecraft:block/custom/fluid_pipe_000000_water
                generation:
                  parent: minecraft:block/custom/fluid_pipe_shape_000000
                  textures:
                    glass: minecraft:block/custom/fluid_pipe_glass
                    core: minecraft:block/custom/fluid_pipe_core_water
            c000000_lava:
              auto-state: cave_vines
              model:
                path: minecraft:block/custom/fluid_pipe_000000_lava
                generation:
                  parent: minecraft:block/custom/fluid_pipe_shape_000000
                  textures:
                    glass: minecraft:block/custom/fluid_pipe_glass
                    core: minecraft:block/custom/fluid_pipe_core_lava

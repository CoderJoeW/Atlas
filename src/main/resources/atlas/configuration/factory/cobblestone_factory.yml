items:
  atlas:cobblestone_factory:
    material: paper
    data:
      item-name: "<!i><gradient:#808080:#A9A9A9>Cobblestone Factory"
    model:
      type: minecraft:model
      path: minecraft:block/custom/cobblestone_factory
      generation:
        parent: minecraft:block/cube
        textures:
          north: minecraft:block/custom/material_factory_cobblestone_face_idle
          south: minecraft:block/custom/material_factory_cobblestone_face_idle
          east: minecraft:block/custom/material_factory_cobblestone_face_idle
          west: minecraft:block/custom/material_factory_cobblestone_face_idle
          up: minecraft:block/custom/material_factory_cobblestone_housing
          down: minecraft:block/custom/material_factory_cobblestone_housing
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: false
          is-view-blocking: false
          is-redstone-conductor: false
          can-occlude: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          # One lamp per ingredient: the left porthole is water, the right is lava, and the
          # amber bar under them is power. Each is set independently by
          # MaterialFactory.renderLamps(), so a half-fed machine shows which half it is
          # still waiting on rather than lighting everything at once.
          properties:
            water:
              type: boolean
              default: false
            lava:
              type: boolean
              default: false
            powered:
              type: boolean
              default: false
          # Rendered as display entities rather than vanilla block states: every
          # appearance shares one forced barrier state, so none of them claims a slot
          # from the auto-state pools. Only the fluid pipe and power cable, which need
          # a state per connection shape, still spend from those.
          appearances:
            idle:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory
            water:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_water
            lava:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_lava
            water_lava:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_water_lava
            powered:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_powered
            water_powered:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_water_powered
            lava_powered:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_lava_powered
            water_lava_powered:
              state: barrier
              entity_renderer:
                item: atlas:cobblestone_factory_water_lava_powered
          variants:
            water=false,lava=false,powered=false:
              appearance: idle
            water=true,lava=false,powered=false:
              appearance: water
            water=false,lava=true,powered=false:
              appearance: lava
            water=true,lava=true,powered=false:
              appearance: water_lava
            water=false,lava=false,powered=true:
              appearance: powered
            water=true,lava=false,powered=true:
              appearance: water_powered
            water=false,lava=true,powered=true:
              appearance: lava_powered
            water=true,lava=true,powered=true:
              appearance: water_lava_powered



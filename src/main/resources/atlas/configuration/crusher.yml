items:
  atlas:crusher:
    material: paper
    data:
      item-name: "<!i><gradient:#8B4513:#CD853F>Crusher"
    model:
      type: minecraft:model
      path: minecraft:block/custom/crusher
      generation:
        parent: minecraft:block/cube
        textures:
          north: minecraft:block/custom/crusher_front
          south: minecraft:block/custom/crusher_back
          east: minecraft:block/custom/crusher_side
          west: minecraft:block/custom/crusher_side
          up: minecraft:block/custom/crusher_top_north
          down: minecraft:block/custom/crusher_housing
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: true
          is-redstone-conductor: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            facing:
              type: horizontal_direction
              default: north
            powered:
              type: boolean
              default: false
          # Rendered as display entities rather than vanilla block states: every
          # appearance shares one forced barrier state, so none of them claims a slot
          # from the auto-state pools. Only the fluid pipe and power cable, which need
          # a state per connection shape, still spend from those.
          appearances:
            north:
              state: barrier
              entity_renderer:
                item: atlas:crusher
            south:
              state: barrier
              entity_renderer:
                item: atlas:crusher_south
            east:
              state: barrier
              entity_renderer:
                item: atlas:crusher_east
            west:
              state: barrier
              entity_renderer:
                item: atlas:crusher_west
            north_powered:
              state: barrier
              entity_renderer:
                item: atlas:crusher_north_powered
            south_powered:
              state: barrier
              entity_renderer:
                item: atlas:crusher_south_powered
            east_powered:
              state: barrier
              entity_renderer:
                item: atlas:crusher_east_powered
            west_powered:
              state: barrier
              entity_renderer:
                item: atlas:crusher_west_powered
          variants:
            facing=north,powered=false:
              appearance: north
            facing=south,powered=false:
              appearance: south
            facing=east,powered=false:
              appearance: east
            facing=west,powered=false:
              appearance: west
            facing=north,powered=true:
              appearance: north_powered
            facing=south,powered=true:
              appearance: south_powered
            facing=east,powered=true:
              appearance: east_powered
            facing=west,powered=true:
              appearance: west_powered



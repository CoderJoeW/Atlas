items:
  atlas:small_drill:
    material: paper
    data:
      item-name: "<!i><gradient:#808080:#FFD700>Small Drill"
    model:
      type: minecraft:model
      path: minecraft:block/custom/small_drill
      generation:
        parent: minecraft:block/cube
        textures:
          north: minecraft:block/custom/small_drill_front
          south: minecraft:block/custom/small_drill
          east: minecraft:block/custom/small_drill_arrow_right
          west: minecraft:block/custom/small_drill_arrow_left
          up: minecraft:block/custom/small_drill_arrow_up
          down: minecraft:block/custom/small_drill_arrow_down
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          hardness: 4.0
          resistance: 4.0
          is-suffocating: true
          is-redstone-conductor: false
          push-reaction: push_only
          tags: ["minecraft:mineable/pickaxe"]
          sounds:
            break: minecraft:block.metal.break
            step: minecraft:block.metal.step
            place: minecraft:block.metal.place
            hit: minecraft:block.metal.hit
            fall: minecraft:block.metal.fall
        states:
          properties:
            facing:
              type: direction
              default: down
          # Rendered as display entities rather than vanilla block states: every
          # appearance shares one forced barrier state, so none of them claims a slot
          # from the auto-state pools. Only the fluid pipe and power cable, which need
          # a state per connection shape, still spend from those.
          #
          # The four horizontal facings are one model turned with `yaw`, the same way
          # the conveyor does it, rather than four pre-rotated copies.
          appearances:
            north:
              state: barrier
              entity_renderer:
                item: atlas:small_drill
            south:
              state: barrier
              entity_renderer:
                item: atlas:small_drill
                yaw: 180
            east:
              state: barrier
              entity_renderer:
                item: atlas:small_drill
                yaw: 90
            west:
              state: barrier
              entity_renderer:
                item: atlas:small_drill
                yaw: -90
            up:
              state: barrier
              entity_renderer:
                item: atlas:small_drill_up
            down:
              state: barrier
              entity_renderer:
                item: atlas:small_drill_down
          variants:
            facing=north:
              appearance: north
            facing=south:
              appearance: south
            facing=east:
              appearance: east
            facing=west:
              appearance: west
            facing=up:
              appearance: up
            facing=down:
              appearance: down


